# =============================================================================
# config/datasets.yaml
# lncSignal-AD — Dataset Registry
#
# IMPORTANT RULES:
#   - All paths are relative to the project root (the folder containing this file's parent).
#   - Do NOT modify the raw/ files. They are read-only originals.
#   - GSE140829 is the external validation hold-out set.
#     Its outcome labels must NOT be used until a final, frozen model exists.
#   - GSE125583 is brain-derived RNA-seq (fusiform gyrus, post-mortem).
#     It CANNOT be compared directly to blood microarray intensity data.
#   - Gene-symbol matching alone is not proof that a microarray probe
#     uniquely measures an lncRNA. See Gate B in AGENTS.md.
#
# Verified against actual downloaded files on 2026-11-21.
# =============================================================================

datasets:

  # ---------------------------------------------------------------------------
  # GSE63061  —  PRIMARY DISCOVERY COHORT
  # ---------------------------------------------------------------------------
  GSE63061:
    geo_accession: "GSE63061"
    role: "discovery"
    locked: false                 # Labels may be used for training

    description: >
      AddNeuroMed cohort batch 2. Whole blood Illumina HT-12 v4 microarray.
      Contains AD, MCI, and Control samples from Europe. Used to discover
      candidate lncRNA-associated probes and train the initial classifier.

    tissue: "whole_blood"
    organism: "Homo sapiens"

    # Technology
    technology: "microarray"
    platform_id: "GPL10558"
    platform_name: "Illumina HumanHT-12 V4.0 expression beadchip"

    # Raw data files (read-only originals — do not modify)
    series_matrix_path: "data/raw/GSE63061_series_matrix.txt.gz"
    annotation_path:    "data/raw/GPL10558-50081.txt"

    # Processed outputs (generated by pipeline scripts — do not commit large files)
    expression_output:  "data/interim/GSE63061/expression.parquet"
    metadata_output:    "data/interim/GSE63061/metadata.csv"

    # Verified file properties (from Stage 05 inventory)
    series_matrix_sha256: "c6de1af5bd36bca3"   # first 16 hex of full SHA-256
    series_matrix_size_bytes: 63713724

    # Data format details (verified by direct inspection)
    expression_format: "GEO_series_matrix"
    expression_scale: "normalized_microarray"   # pre-normalized, NOT raw counts
    feature_id_type: "ILMN_probe_id"           # e.g. ILMN_1343048
    sample_id_prefix: "GSM"

    # Metadata characteristic keys (verified against actual file L38–L43)
    characteristic_keys:
      diagnosis: "status"          # values seen: MCI, Alzheimer's disease, Control
      age: "age"
      sex: "gender"
      tissue: "tissue"

    # Known sample counts (from !Series_sample_id — 388 total incl. MCI)
    expected_sample_count: 388
    # Note: AD+Control+MCI — exact breakdown verified during Stage 08 parsing


  # ---------------------------------------------------------------------------
  # GSE63060  —  REPLICATION COHORT
  # ---------------------------------------------------------------------------
  GSE63060:
    geo_accession: "GSE63060"
    role: "replication"
    locked: false                 # Labels may be used for replication verification

    description: >
      AddNeuroMed cohort batch 1. Whole blood Illumina HT-12 v3 microarray.
      Contains AD, MCI, and Control samples. Used to confirm discovery-stage
      DE direction and lncRNA candidate list. Different platform (v3 vs v4)
      means probes are not directly identical to GSE63061.

    tissue: "whole_blood"
    organism: "Homo sapiens"

    technology: "microarray"
    platform_id: "GPL6947"
    platform_name: "Illumina HumanHT-12 V3.0 expression beadchip"

    series_matrix_path: "data/raw/GSE63060_series_matrix.txt.gz"
    annotation_path:    "data/raw/GPL6947-13512.txt"

    expression_output:  "data/interim/GSE63060/expression.parquet"
    metadata_output:    "data/interim/GSE63060/metadata.csv"

    series_matrix_sha256: "5233e79ab7eece13"
    series_matrix_size_bytes: 62803866

    expression_format: "GEO_series_matrix"
    expression_scale: "normalized_microarray"
    feature_id_type: "ILMN_probe_id"
    sample_id_prefix: "GSM"

    characteristic_keys:
      diagnosis: "status"          # same field name as GSE63061
      age: "age"
      sex: "gender"
      tissue: "tissue"

    expected_sample_count: 329


  # ---------------------------------------------------------------------------
  # GSE140829  —  EXTERNAL VALIDATION (HOLD-OUT — LABELS LOCKED)
  # ---------------------------------------------------------------------------
  GSE140829:
    geo_accession: "GSE140829"
    role: "external_validation"
    locked: true                  # OUTCOME LABELS MUST REMAIN LOCKED
                                  # until model is fully frozen and
                                  # feature/probe compatibility confirmed.

    description: >
      UCLA/UCSF whole blood cohort. Illumina HT-12 v4 microarray (GPL15988).
      This is the final hold-out test set. Contains AD, MCI, and Control.
      CAUTION: Labels must NOT be used for feature selection, QC-driven
      sample removal, or threshold tuning. Use only for final AUC evaluation
      after freezing the model in Gates B-D.
      Platform GPL15988 uses a 4-column annotation (ID, GB_ACC, GENE SYMBOL,
      GENE DESCRIPTION). Probe IDs are nuID-style alphanumeric strings, NOT
      ILMN_* identifiers. Crosswalk to GPL10558 probes must be verified.

    tissue: "whole_blood"
    organism: "Homo sapiens"

    technology: "microarray"
    platform_id: "GPL15988"
    platform_name: "Illumina HumanHT-12 V4.0 expression beadchip (re-annotated)"

    series_matrix_path: "data/raw/GSE140829_series_matrix.txt.gz"
    annotation_path:    "data/raw/GPL15988.txt"

    expression_output:  "data/interim/GSE140829/expression.parquet"
    metadata_output:    "data/interim/GSE140829/metadata.csv"

    series_matrix_sha256: "be4f08a2cb01fe91"
    series_matrix_size_bytes: 226272058

    expression_format: "GEO_series_matrix"
    expression_scale: "normalized_microarray"
    feature_id_type: "nuID_or_other"   # Probe ID format differs from GPL10558
    sample_id_prefix: "GSM"

    # Characteristics verified against actual file L38–L43
    characteristic_keys:
      diagnosis: "diagnosis"       # key name differs from GSE6306x!
      age: "age_at_draw"
      sex: "Sex"
      batch: "batch"
      apoe: "apoe_status"

    expected_sample_count: 587


  # ---------------------------------------------------------------------------
  # GSE125583  —  BRAIN BIOLOGICAL SUPPORT (NOT BLOOD VALIDATION)
  # ---------------------------------------------------------------------------
  GSE125583:
    geo_accession: "GSE125583"
    role: "brain_support"
    locked: false

    description: >
      Genentech/UCSF post-mortem fusiform gyrus RNA-seq. 289 samples.
      Used ONLY for biological plausibility: confirming that blood candidate
      lncRNAs also show directionally consistent changes in brain tissue.
      CANNOT serve as independent blood validation.
      Gene IDs are NCBI Entrez integers (from NCBI RNA-seq counts file).
      GENCODE GTF uses Ensembl IDs. Crosswalk via Human.GRCh38.p13.annot.tsv
      must be audited before merging.
      PyDESeq2 (not limma) is appropriate here because values are raw integer
      counts.

    tissue: "fusiform_gyrus_brain"
    organism: "Homo sapiens"

    technology: "RNA-seq"
    platform_id: "GPL16791"
    platform_name: "Illumina HiSeq 2500 (Homo sapiens)"

    series_matrix_path: "data/raw/GSE125583_series_matrix.txt.gz"
    counts_path:        "data/raw/GSE125583_raw_counts_GRCh38.p13_NCBI.tsv.gz"
    annotation_path:    "data/raw/Human.GRCh38.p13.annot.tsv.gz"

    expression_output:  "data/interim/GSE125583/counts.parquet"
    metadata_output:    "data/interim/GSE125583/metadata.csv"

    series_matrix_sha256: "6817baa614825e99"
    series_matrix_size_bytes: 14446
    counts_sha256: "07f2763c4f7d3909"
    counts_size_bytes: 12084520

    expression_format: "NCBI_rnaseq_counts"
    expression_scale: "raw_integer_counts"      # Must use DESeq2/PyDESeq2
    feature_id_type: "entrez_gene_id"           # Numeric, e.g. 100287102
    sample_id_prefix: "GSM"

    characteristic_keys:
      diagnosis: "disease state"   # expect: Alzheimer's, neurologically normal
      age: "age at death"
      sex: "sex"

    expected_sample_count: 289
    expected_gene_count: 39376


# ---------------------------------------------------------------------------
# Shared annotation files
# ---------------------------------------------------------------------------
annotations:

  gencode_lncrna_gtf:
    path: "data/raw/gencode.v50.long_noncoding_RNAs.gtf.gz"
    version: "GENCODE v50 (GRCh38, Ensembl 116)"
    id_type: "ensembl_gene_id"       # ENSG... format
    description: "lncRNA gene/transcript annotations for probe mapping"
    expected_records: 965508

  gencode_transcripts_fasta:
    path: "data/optional_raw_data/gencode.v50.transcripts.fa.gz"
    version: "GENCODE v50 (GRCh38, Ensembl 116)"
    description: "Full transcript FASTA for BLAST-based probe specificity"
    required: false                  # Optional; needed for Gate B alignment

  ncbi_gene_annotation:
    path: "data/raw/Human.GRCh38.p13.annot.tsv.gz"
    source: "NCBI Gene (GRCh38.p13)"
    id_type: "entrez_gene_id"
    description: "Links Entrez IDs to Ensembl IDs, symbols and gene types"
    expected_genes: 39376
    columns: ["GeneID","Symbol","Description","Synonyms","GeneType",
              "EnsemblGeneID","Status","ChrAcc","ChrStart","ChrStop",
              "Orientation","Length","GOFunctionID","GOProcessID",
              "GOComponentID","GOFunction","GOProcess","GOComponent"]
